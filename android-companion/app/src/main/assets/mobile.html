<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'"><title>Codeclub</title>
<style>
:root{color-scheme:dark;--accent:#2d5fd6}*{box-sizing:border-box}body{margin:0;background:#111;color:#eee;font:15px system-ui,-apple-system,sans-serif;height:100dvh;overflow:hidden}button,textarea{font:inherit}button{border:0;background:none;color:inherit;cursor:pointer;min-height:44px;border-radius:14px}button:focus-visible,textarea:focus-visible{outline:2px solid #8bc7ff;outline-offset:2px}button:disabled{opacity:.4}header{height:72px;display:flex;align-items:center;padding:12px 20px;gap:12px;border-bottom:1px solid #202020}.orb{width:38px;height:38px;flex-shrink:0;background:radial-gradient(circle at 35% 22%,#fff 0 28%,#b6d6ff 55%,var(--accent) 87%);clip-path:polygon(50% 0%,63% 10%,68% 22%,91% 32%,100% 47%,87% 65%,81% 91%,65% 99%,49% 93%,30% 100%,15% 89%,14% 68%,0% 48%,5% 33%,30% 22%,39% 7%)}#identity{min-width:0;flex:1}#name{font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#status{font-size:12px;color:#888;margin-top:4px}.icon{width:44px;display:grid;place-items:center}.icon svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}#body{height:calc(100dvh - 72px);display:flex;flex-direction:column}#onboarding{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;gap:16px}#onboarding .orb{height:90px;width:90px;margin-bottom:12px}h1{font-size:24px;font-weight:550;margin:0}p{color:#888;font-size:14px;line-height:1.6;max-width:300px;margin:0}.primary{background:#eee;color:#111;padding:0 26px;font-size:14px}.subtle{color:#999;font-size:13px;padding:0 18px}#conversation{flex:1;overflow:auto;padding:20px;scrollbar-width:none}#conversation::-webkit-scrollbar{display:none}.message{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65;margin:0 0 24px}.message.user{margin-left:28px;padding:12px 16px;background:#1e1e1e;border-radius:18px}.message.assistant{padding:3px 0;color:#ddd}.message pre{font-size:12px;line-height:1.5;background:#191919;border:1px solid #2b2b2b;border-radius:14px;padding:14px;overflow:auto;white-space:pre}.message code{font-family:monospace}.message.pending{opacity:.55}#activity,#notice{font-size:12px;color:#888;padding:0 22px 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#notice{color:#c9a379}form{display:flex;gap:6px;align-items:flex-end;margin:0 16px 16px;padding:8px;background:#191919;border:1px solid #2b2b2b;border-radius:22px}textarea{flex:1;min-width:0;border:0;outline:none!important;resize:none;background:none;color:#eee;max-height:130px;padding:10px 8px;font-size:15px;line-height:1.5}#send{background:#eee;color:#111;border-radius:50%;width:38px;height:38px;min-height:38px;margin:3px}dialog{background:#191919;color:#eee;border:1px solid #2b2b2b;border-radius:22px;width:calc(100% - 32px);max-width:440px;padding:14px;max-height:80dvh}dialog::backdrop{background:#0008}dialog header{border:0;padding:0 8px;height:48px}#chatList{overflow:auto;max-height:60dvh}#chatList button{display:block;width:100%;text-align:left;padding:10px 14px}#chatList small{display:block;color:#888;font-size:11px;margin-top:3px}#chatList button[aria-current=true]{background:#2b2b2b}#empty{text-align:center;color:#777;padding:70px 14px;font-size:14px}#older{width:100%;font-size:12px;color:#888}.busy{opacity:.8}[hidden]{display:none!important}
</style></head><body>
<header><div class="orb" id="orb" aria-hidden="true"></div><div id="identity"><div id="name">Codeclub</div><div id="status" aria-live="polite"></div></div><button class="icon" id="chats"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v12H8l-4 4z"/></svg></button><button class="icon" id="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button></header>
<main id="body"><section id="onboarding"><div class="orb" aria-hidden="true"></div><h1 id="welcome"></h1><p id="hint"></p><button class="primary" id="scan"></button><button class="subtle" id="paste"></button></section><section id="conversation" role="log" aria-label="Chat" hidden><button id="older" hidden></button><div id="messages"></div><div id="empty"></div></section><div id="approvals" style="padding:0 20px"></div><div id="notice" role="status" hidden></div><div id="activity" role="status" hidden></div><form id="composer" hidden><textarea id="input" rows="1" maxlength="16000"></textarea><button class="icon" id="stop" type="button" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button><button class="icon" id="send" type="submit"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 11 6-6 6 6M12 5v14"/></svg></button></form></main>
<dialog id="picker"><header><span id="pickerTitle" style="flex:1"></span><button class="icon" id="closePicker">×</button></header><div id="chatList"></div></dialog>
<script src="i18n/i18next.min.js"></script>
<script src="i18n/en.js"></script>
<script src="i18n/es.js"></script>
<script src="i18n/runtime.js"></script>
<script>
const $=id=>document.getElementById(id),post=data=>Codeclub.request(JSON.stringify(data));

const cloudShape="polygon("+Array.from({length:96},(_,i)=>{const a=i/96*Math.PI*2,r=43+5*Math.cos(5*a+Math.PI/2);return (50+r*Math.cos(a))+"% "+(50+r*Math.sin(a))+"%";}).join(",")+")";
// Unsent composer drafts stay in memory; queued sends are encrypted by the native bridge.
const drafts={};
let selected='',before,renderKey='',catalogKey='',lastLinked=false,lastTotal=0,t=mobileMessages('en'),history=new Map(),lastMessages=[];
function label(id,value){if($(id).textContent!==value)$(id).textContent=value;}
function pick(key){try{drafts[selected]=$('input').value;$('input').value=drafts[key]||'';}catch{}selected=key;before=undefined;lastTotal=0;history.clear();renderKey='';$('picker').close();post({operation:'sync',chatKey:selected});}
// Build text and code nodes without interpreting model output as HTML or native commands.
function renderMessage(message){const node=document.createElement('div');node.className='message '+message.role+(message.pending?' pending':'');node.dataset.messageId=message.id;const parts=message.text.split('```');parts.forEach((part,index)=>{if(index%2){const pre=document.createElement('pre'),code=document.createElement('code');code.textContent=part.replace(/^[\w+-]+\n/,'');pre.append(code);node.append(pre);}else node.append(document.createTextNode(part));});if(message.failed){const retry=document.createElement('button');retry.className='subtle';retry.textContent=t.retry;retry.onclick=()=>{const bytes=new Uint8Array(16);crypto.getRandomValues(bytes);post({operation:'send',id:[...bytes].map(byte=>byte.toString(16).padStart(2,'0')).join(''),text:message.text,chatKey:message.chatKey,retryId:message.id});};node.append(retry);}return node;}
// Poll cached native state, reconcile pagination and preserve the reader's scroll position.
function tick(){
 try{
  const state=JSON.parse(Codeclub.snapshot());t=mobileMessages(state.language);const desktop=state.desktop||{},chats=desktop.chats||[];
  $('scan').disabled=state.pairing===true;$('paste').disabled=state.pairing===true;['welcome','scan','paste','older'].forEach(id=>label(id,t[id]));label('hint',t.hint);label('pickerTitle',t.chats);
  $('chats').setAttribute('aria-label',t.chats);$('settings').setAttribute('aria-label',t.settings);$('closePicker').setAttribute('aria-label',t.close);$('send').setAttribute('aria-label',t.send);$('input').setAttribute('aria-label',t.input);$('input').placeholder=t.input;
  $('onboarding').hidden=state.linked;$('conversation').hidden=!state.linked;$('composer').hidden=!state.linked;$('chats').hidden=!state.linked;
  if(lastLinked&&!state.linked){selected='';history.clear();$('messages').replaceChildren();}lastLinked=state.linked;
  if(!selected||!chats.some(chat=>chat.key===selected)){const next=chats.find(chat=>chat.orb)||chats[0];if(next&&selected!==next.key){selected=next.key;history.clear();renderKey='';}}
  const chat=chats.find(item=>item.key===selected);label('name',chat?.orb?.name||chat?.name||'Codeclub');label('status',state.pairing?t.connecting:!state.linked?'':!state.connected?t.offline:state.paused?t.paused:t.connected);
  document.documentElement.style.setProperty('--accent',chat?.orb?.color||'#2d5fd6');const shape=chat?.orb?.shape||'cloud';document.querySelectorAll('.orb').forEach(orb=>{orb.style.clipPath=shape==='circle'?'circle(48%)':shape==='square'?'inset(5% round 22%)':shape==='triangle'?'polygon(50% 5%,95% 92%,5% 92%)':cloudShape;});$('orb').classList.toggle('busy',desktop.busy===true);
  const listKey=JSON.stringify(chats)+selected;if(listKey!==catalogKey){catalogKey=listKey;$('chatList').replaceChildren();for(const item of chats){const button=document.createElement('button');button.setAttribute('aria-current',String(item.key===selected));button.textContent=item.name;const sub=document.createElement('small');sub.textContent=item.orb?item.orb.model:item.project;button.append(sub);button.onclick=()=>pick(item.key);$('chatList').append(button);}if(!chats.length)$('chatList').textContent=t.noChats;}
  if(desktop.selectedKey===selected){
    const incoming=desktop.messages||[];
    if(desktop.total<lastTotal||desktop.total===0&&!desktop.busy)history.clear();lastTotal=desktop.total||0;if(before!==undefined&&desktop.before===before){incoming.forEach(message=>history.set(message.id,message));before=undefined;}
    lastMessages=incoming;
    const latestIds=new Set(incoming.map(message=>message.id));const older=[...history.values()].filter(message=>!latestIds.has(message.id)&&message.seq<(incoming[0]?.seq??Infinity)).sort((a,b)=>a.seq-b.seq);
    const local=(state.localOutbox||[]).filter(message=>message.chatKey===selected&&!incoming.some(item=>item.requestId===message.id)).map(message=>({id:message.id,role:'user',text:message.text,pending:!message.failed,failed:message.failed,chatKey:message.chatKey}));
    const messages=[...older,...incoming,...local];const nextKey=JSON.stringify(messages);
    if(nextKey!==renderKey){const nearBottom=!renderKey||$('conversation').scrollHeight-$('conversation').scrollTop-$('conversation').clientHeight<100;renderKey=nextKey;$('messages').replaceChildren(...messages.map(renderMessage));if(nearBottom)$('conversation').scrollTop=$('conversation').scrollHeight;}
    const loadedStart=Math.min(desktop.start||0,...[...history.values()].map(message=>message.seq));$('older').hidden=!(loadedStart>0);$('older').dataset.before=String(loadedStart);label('empty',messages.length?'':t.empty);
  }
  label('activity',desktop.busy?(['streaming','thinking','connecting','working','approval'].includes(desktop.activity)?t.working:desktop.activity||t.working):'');$('stop').hidden=!desktop.busy;$('stop').disabled=!state.connected;$('stop').setAttribute('aria-label',t.cancelRun);const approvalsKey=JSON.stringify(desktop.approvals||[])+selected+t.approve;if($('approvals').dataset.key!==approvalsKey){$('approvals').dataset.key=approvalsKey;$('approvals').replaceChildren();for(const approval of desktop.approvals||[]){const card=document.createElement('div'),summary=document.createElement('p');summary.textContent=approval.summary;card.append(summary);for(const [action,title] of [['approve',t.approve],['deny',t.deny]]){const button=document.createElement('button');button.textContent=title;button.className='subtle';button.onclick=()=>post({operation:'control',chatKey:selected,action,approvalId:approval.id});card.append(button);}$('approvals').append(card);}}$('activity').hidden=!desktop.busy;
  const queued=(desktop.outbox||[]).some(item=>item.state==='queued'&&item.chatKey===selected)||(state.localOutbox||[]).length;const failed=(state.localOutbox||[]).some(item=>item.failed&&item.chatKey===selected);const notice=state.error?t.syncError:failed||desktop.error?t.failed:queued?t.queue:state.linked&&!state.accessibility?t.permissions:'';label('notice',notice);$('notice').hidden=!notice;
  $('send').disabled=!selected||!$('input').value.trim();
  if(state.linked)post({operation:'sync',chatKey:selected,...(before!==undefined?{before}:{})});
 }catch{/* The bridge may be reconnecting. */}
}
$('stop').onclick=()=>post({operation:'control',chatKey:selected,action:'cancel'});$('scan').onclick=()=>post({action:'scan'});$('paste').onclick=()=>post({action:'paste'});$('settings').onclick=()=>post({action:'settings'});$('chats').onclick=()=>$('picker').showModal();$('closePicker').onclick=()=>$('picker').close();$('older').onclick=()=>{lastMessages.forEach(message=>history.set(message.id,message));before=Number($('older').dataset.before);post({operation:'sync',chatKey:selected,before});};
$('input').oninput=()=>{try{localStorage.setItem('draft:'+selected,$('input').value);}catch{}$('input').style.height='auto';$('input').style.height=Math.min($('input').scrollHeight,130)+'px';$('send').disabled=!selected||!$('input').value.trim();};
$('composer').onsubmit=event=>{event.preventDefault();const text=$('input').value.trim();if(!text||!selected)return;const bytes=new Uint8Array(16);crypto.getRandomValues(bytes);const id=[...bytes].map(byte=>byte.toString(16).padStart(2,'0')).join('');post({operation:'send',id,text,chatKey:selected});$('input').value='';try{delete drafts[selected];}catch{}$('input').style.height='auto';$('send').disabled=true;setTimeout(tick,100);};
tick();setInterval(tick,1000);
</script></body></html>
